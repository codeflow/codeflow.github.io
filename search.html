<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <link rel="icon" type="image/png" href="./resources/img/codeflow.png">

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="${lang === 'en' ? 'Please enter a search term in the search box above.' : 'Por favor, digite um termo de busca no campo acima.'}">
    <meta name="keywords" content="resultados, busca, java, golang, go programming">
    <meta name="author" content="Rafael Santos">
    <meta name="robots" content="index, follow">
    <link rel="canonical" href="https://codeflow.com.br/search.html">
    
    <!-- Open Graph / Facebook -->
    <meta property="og:type" content="website">
    <meta property="og:url" content="https://codeflow.com.br/search.html">
    <meta property="og:title" content="🔍 Resultados da Busca">
    <meta property="og:description" content="${lang === 'en' ? 'Please enter a search term in the search box above.' : 'Por favor, digite um termo de busca no campo acima.'}">
    <meta property="og:image" content="https://codeflow.com.br/resources/img/codeflow.png">
    <meta property="og:site_name" content="Codeflow">
    <meta property="og:locale" content="pt_BR">
    
    <!-- Twitter -->
    <meta name="twitter:card" content="summary_large_image">
    <meta name="twitter:url" content="https://codeflow.com.br/search.html">
    <meta name="twitter:title" content="🔍 Resultados da Busca">
    <meta name="twitter:description" content="${lang === 'en' ? 'Please enter a search term in the search box above.' : 'Por favor, digite um termo de busca no campo acima.'}">
    <meta name="twitter:image" content="https://codeflow.com.br/resources/img/codeflow.png">
    

    <title>Resultados da Busca - Codeflow</title>
    <link rel="stylesheet" href="resources/css/themes/bluesky/theme.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.9.0/styles/github.min.css">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.9.0/highlight.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/highlightjs-line-numbers.js/2.8.0/highlightjs-line-numbers.min.js"></script>
    <style>
        .search-results {
            margin-top: 1rem;
        }
        .search-result-item {
            margin-bottom: 1.5rem;
            padding: 1rem;
            border: 1px solid #BED6F8;
            background-color: #FFFFFF;
            border-left: 4px solid #0078D0;
        }
        .search-result-item:hover {
            background-color: #ECF4FE;
            border-left-color: #0090FF;
        }
        .search-result-title {
            font-size: 14px;
            font-weight: bold;
            color: #0B356C;
            margin-bottom: 0.5rem;
        }
        .search-result-title a {
            color: #0078D0;
            text-decoration: none;
        }
        .search-result-title a:hover {
            color: #0090FF;
            text-decoration: underline;
        }
        .search-result-path {
            font-size: 10px;
            color: #666;
            margin-bottom: 0.5rem;
            font-style: italic;
        }
        .search-result-description {
            font-size: 11px;
            color: #000000;
            line-height: 1.5;
            margin-bottom: 0.5rem;
        }
        .search-result-snippet {
            font-size: 10px;
            color: #666;
            font-style: italic;
            margin-top: 0.5rem;
        }
        .search-no-results {
            padding: 2rem;
            text-align: center;
            color: #666;
        }
        .search-loading {
            padding: 2rem;
            text-align: center;
            color: #666;
        }
        .search-stats {
            font-size: 11px;
            color: #666;
            margin-bottom: 1rem;
            padding-bottom: 0.5rem;
            border-bottom: 1px solid #BED6F8;
        }
    </style>
    <script type="application/ld+json">
{
  "@context": "https://schema.org",
  "@type": "WebPage",
  "name": "🔍 Resultados da Busca",
  "description": "${lang === 'en' ? 'Please enter a search term in the search box above.' : 'Por favor, digite um termo de busca no campo acima.'}",
  "url": "https://codeflow.com.br/search.html"
}
    </script>
</head>
<body class="app-page">
    <div class="app-layout">
        <!-- Menu Lateral -->
        <aside class="app-sidebar" id="sidebar">
            <div class="app-sidebar__header">
                <a href="index.html"><img src="resources/img/codeflow.png" alt="Codeflow" class="app-sidebar__logo"></a>
                <span>CODEFLOW</span>
            </div>
            <div class="app-sidebar__content">
                <div class="app-search-box">
                    <input type="text" id="searchInput" placeholder="🔍 Buscar conteúdo..." class="app-search-input">
                    <button id="searchButton" class="app-search-button" title="Buscar">🔍</button>
                </div>
                <ul class="app-tree" id="treeView">
                    <!-- Menu será construído dinamicamente pelo menu.js -->
                </ul>
            </div>
            <div class="app-sidebar__resizer" id="resizer"></div>
        </aside>

        <!-- Área de Conteúdo -->
        <main class="app-content">
            <div class="app-content__header">
                <div class="app-content__header-left">
                    <button class="app-mobile-menu-toggle" id="mobileMenuToggle" aria-label="Toggle menu">
                        <span></span>
                        <span></span>
                        <span></span>
                    </button>
                    <a href="index.html"><img src="resources/img/codeflow.png" alt="Codeflow" class="app-content__logo-mobile"></a>
                    <span id="contentHeader">🔍 Resultados da Busca</span>
                </div>
                <div class="language-selector">
                    <select id="languageSelector">
                        <option value="br" selected>🇧🇷 Português</option>
                        <option value="en">🇺🇸 English</option>
                    </select>
                </div>
            </div>
            <div class="app-content__body" id="contentBody">
                <div class="content-container">
                    <h1>🔍 Resultados da Busca</h1>
                    
                    <div id="searchResultsContainer">
                        <div class="search-loading">⏳ Carregando resultados...</div>
                    </div>
                </div>
            </div>
        </main>
    </div>

    <!-- Overlay para Mobile -->
    <div class="app-mobile-overlay" id="mobileOverlay"></div>

    <!-- JavaScript externo -->
    <script src="resources/js/hash.js"></script>
    <script src="resources/js/i18n.js"></script>
    <script src="resources/js/sidebar.js"></script>
    <script src="resources/js/tree.js"></script>
    <script src="resources/js/main.js"></script>
    <script src="resources/js/search.js"></script>
    <script>
        // Processa os resultados da busca
        (async function() {
            const urlParams = new URLSearchParams(window.location.search);
            const query = urlParams.get('q') || '';
            const lang = urlParams.get('lang') || localStorage.getItem('codeflow-language') || 'br';
            
            // Atualiza o idioma
            localStorage.setItem('codeflow-language', lang);
            if (document.getElementById('languageSelector')) {
                document.getElementById('languageSelector').value = lang;
            }
            
            // Atualiza placeholder do campo de busca
            const searchInput = document.getElementById('searchInput');
            if (searchInput) {
                searchInput.value = query;
                searchInput.placeholder = lang === 'en' ? '🔍 Search content...' : '🔍 Buscar conteúdo...';
            }
            
            const resultsContainer = document.getElementById('searchResultsContainer');
            
            if (!query || query.trim().length === 0) {
                resultsContainer.innerHTML = `
                    <div class="search-no-results">
                        <h2>${lang === 'en' ? 'No search query' : 'Nenhuma busca realizada'}</h2>
                        <p>${lang === 'en' ? 'Please enter a search term in the search box above.' : 'Por favor, digite um termo de busca no campo acima.'}</p>
                    </div>
                `;
                return;
            }
            
            try {
                console.log('Search: Construindo índice de busca...');
                // Constrói o índice de busca
                const index = await buildSearchIndex();
                console.log('Search: Índice construído com', index ? index.length : 0, 'páginas');
                
                // Realiza a busca
                console.log('Search: Buscando por:', query);
                const results = searchContent(query, index);
                console.log('Search: Encontrados', results.length, 'resultados');
                
                // Exibe os resultados
                if (results.length === 0) {
                    resultsContainer.innerHTML = `
                        <div class="search-stats">
                            ${lang === 'en' ? `No results found for "${query}"` : `Nenhum resultado encontrado para "${query}"`}
                        </div>
                        <div class="search-no-results">
                            <h2>${lang === 'en' ? 'No results found' : 'Nenhum resultado encontrado'}</h2>
                            <p>${lang === 'en' ? 'Try different keywords or check the spelling.' : 'Tente palavras-chave diferentes ou verifique a ortografia.'}</p>
                        </div>
                    `;
                } else {
                    let html = `
                        <div class="search-stats">
                            ${lang === 'en' 
                                ? `Found ${results.length} result${results.length > 1 ? 's' : ''} for "${query}"`
                                : `Encontrado${results.length > 1 ? 's' : ''} ${results.length} resultado${results.length > 1 ? 's' : ''} para "${query}"`}
                        </div>
                        <div class="search-results">
                    `;
                    
                    results.forEach(result => {
                        // Calcula caminho relativo
                        let relativeUrl = result.url;
                        if (relativeUrl.startsWith('content/')) {
                            relativeUrl = './' + relativeUrl;
                        }
                        
                        html += `
                            <div class="search-result-item">
                                <div class="search-result-title">
                                    <a href="${relativeUrl}">📖 ${result.title}</a>
                                </div>
                                ${result.path ? `<div class="search-result-path">📍 ${result.path}</div>` : ''}
                                <div class="search-result-description">
                                    ${result.description}
                                </div>
                                ${result.snippet ? `<div class="search-result-snippet">${result.snippet}</div>` : ''}
                            </div>
                        `;
                    });
                    
                    html += '</div>';
                    resultsContainer.innerHTML = html;
                }
            } catch (error) {
                console.error('Erro ao realizar busca:', error);
                resultsContainer.innerHTML = `
                    <div class="search-no-results">
                        <h2>${lang === 'en' ? 'Search Error' : 'Erro na Busca'}</h2>
                        <p>${lang === 'en' ? 'An error occurred while searching. Please try again.' : 'Ocorreu um erro ao realizar a busca. Por favor, tente novamente.'}</p>
                    </div>
                `;
            }
        })();
    </script>
</body>
</html>
