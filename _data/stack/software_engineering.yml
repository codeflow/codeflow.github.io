    - id: resilience
      name: { en: "Resilience Patterns", pt-BR: "Padrões de Resiliência", es: "Patrones de Resiliencia" }
      desc: { en: "Timeouts, retries with backoff, circuit breakers, bulkheads and graceful degradation for systems that depend on others.", pt-BR: "Timeouts, novas tentativas com recuo, disjuntores, anteparas e degradação graciosa para sistemas que dependem de outros.", es: "Timeouts, reintentos con retroceso, cortacircuitos, mamparas y degradación controlada para sistemas que dependen de otros." }
