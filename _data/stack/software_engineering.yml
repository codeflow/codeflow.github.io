      desc: { en: "Schemas, normalisation, transactions, indexes and query planning: the model most business data still lives in.", pt-BR: "Esquemas, normalização, transações, índices e planejamento de consultas: o modelo em que a maioria dos dados de negócio ainda vive.", es: "Esquemas, normalización, transacciones, índices y planificación de consultas: el modelo en el que aún vive la mayoría de los datos de negocio." }
    - id: nosql
