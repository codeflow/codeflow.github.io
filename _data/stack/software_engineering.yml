  children:
    - id: observability
      name: { en: "Observability", pt-BR: "Observabilidade", es: "Observabilidad" }
      desc: { en: "Logs, metrics and traces designed so that unknown problems can be investigated, not only known ones alerted.", pt-BR: "Logs, métricas e rastros projetados para que problemas desconhecidos possam ser investigados, e não só os conhecidos alertados.", es: "Logs, métricas y trazas diseñados para que los problemas desconocidos puedan investigarse, y no solo alertar los conocidos." }
    - id: sre
      name: { en: "Site Reliability Engineering", pt-BR: "Engenharia de Confiabilidade de Sites", es: "Ingeniería de Confiabilidad de Sitios" }
      desc: { en: "Service level objectives, error budgets and toil reduction as an engineering approach to operations.", pt-BR: "Objetivos de nível de serviço, orçamentos de erro e redução de trabalho repetitivo como abordagem de engenharia para a operação.", es: "Objetivos de nivel de servicio, presupuestos de error y reducción del trabajo repetitivo como enfoque de ingeniería para la operación." }
