    - id: caching
      name: { en: "Caching and Content Delivery", pt-BR: "Cache e Distribuição de Conteúdo", es: "Caché y Distribución de Contenido" }
      desc: { en: "Where to cache, for how long and how to invalidate, from in-process caches to CDNs at the edge.", pt-BR: "Onde cachear, por quanto tempo e como invalidar, de caches em processo a CDNs na borda.", es: "Dónde cachear, por cuánto tiempo y cómo invalidar, desde cachés en proceso hasta CDN en el borde." }
    - id: scalability
