  children:
    - id: threat-modeling
      name: { en: "Threat Modelling and Secure Design", pt-BR: "Modelagem de Ameaças e Projeto Seguro", es: "Modelado de Amenazas y Diseño Seguro" }
      desc: { en: "Identifying assets, attackers and attack surfaces early, and designing least privilege and defence in depth.", pt-BR: "Identificar ativos, atacantes e superfícies de ataque cedo, e projetar privilégio mínimo e defesa em profundidade.", es: "Identificar activos, atacantes y superficies de ataque desde temprano, y diseñar privilegio mínimo y defensa en profundidad." }
