      desc: { en: "Static and dynamic scanning, penetration testing, monitoring, vulnerability disclosure and response.", pt-BR: "Varredura estática e dinâmica, testes de penetração, monitoramento, divulgação de vulnerabilidades e resposta.", es: "Escaneo estático y dinámico, pruebas de penetración, monitoreo, divulgación de vulnerabilidades y respuesta." }
    - id: privacy-engineering
      name: { en: "Privacy Engineering", pt-BR: "Engenharia de Privacidade", es: "Ingeniería de Privacidad" }
      desc: { en: "Data minimisation, privacy by design and technical controls that turn regulation into system properties.", pt-BR: "Minimização de dados, privacidade desde o projeto e controles técnicos que transformam regulação em propriedades do sistema.", es: "Minimización de datos, privacidad desde el diseño y controles técnicos que convierten la regulación en propiedades del sistema." }

- id: process
  name: { en: "Software Process and Methods", pt-BR: "Processo e Métodos de Software", es: "Proceso y Métodos de Software" }
  desc: { en: "How work is organised over time: lifecycles, agile and lean practices, and the improvement of the process itself.", pt-BR: "Como o trabalho se organiza no tempo: ciclos de vida, práticas ágeis e lean, e a melhoria do próprio processo.", es: "Cómo se organiza el trabajo en el tiempo: ciclos de vida, prácticas ágiles y lean, y la mejora del propio proceso." }
  children:
    - id: lifecycles
      name: { en: "Lifecycle Models", pt-BR: "Modelos de Ciclo de Vida", es: "Modelos de Ciclo de Vida" }
      desc: { en: "Waterfall, iterative, incremental, spiral and continuous models, and the contexts each one fits.", pt-BR: "Modelos cascata, iterativo, incremental, espiral e contínuo, e os contextos em que cada um se encaixa.", es: "Modelos en cascada, iterativo, incremental, en espiral y continuo, y los contextos en los que encaja cada uno." }
    - id: agile
      name: { en: "Agile Frameworks", pt-BR: "Frameworks Ágeis", es: "Marcos Ágiles" }
      desc: { en: "Scrum, Kanban, XP and scaled approaches: roles, ceremonies, artefacts and the principles behind them.", pt-BR: "Scrum, Kanban, XP e abordagens escaladas: papéis, cerimônias, artefatos e os princípios por trás deles.", es: "Scrum, Kanban, XP y enfoques escalados: roles, ceremonias, artefactos y los principios detrás de ellos." }
    - id: lean
      name: { en: "Lean and Flow", pt-BR: "Lean e Fluxo", es: "Lean y Flujo" }
      desc: { en: "Limiting work in progress, reducing batch size and measuring lead time to make delivery predictable.", pt-BR: "Limitar o trabalho em andamento, reduzir o tamanho dos lotes e medir o lead time para tornar a entrega previsível.", es: "Limitar el trabajo en curso, reducir el tamaño de los lotes y medir el lead time para volver predecible la entrega." }
    - id: process-improvement
      name: { en: "Process Assessment and Improvement", pt-BR: "Avaliação e Melhoria de Processos", es: "Evaluación y Mejora de Procesos" }
      desc: { en: "Maturity models, retrospectives and metrics such as the DORA four keys used to improve how a team delivers.", pt-BR: "Modelos de maturidade, retrospectivas e métricas como as quatro chaves do DORA usadas para melhorar como um time entrega.", es: "Modelos de madurez, retrospectivas y métricas como las cuatro claves de DORA usadas para mejorar cómo entrega un equipo." }
    - id: documentation
      name: { en: "Technical Documentation", pt-BR: "Documentação Técnica", es: "Documentación Técnica" }
      desc: { en: "Docs as code, architecture and API documentation, runbooks and the writing habits that keep them current.", pt-BR: "Documentação como código, documentação de arquitetura e de API, runbooks e os hábitos de escrita que as mantêm atualizadas.", es: "Documentación como código, documentación de arquitectura y de API, runbooks y los hábitos de escritura que las mantienen al día." }
    - id: formal-methods
      name: { en: "Formal Methods", pt-BR: "Métodos Formais", es: "Métodos Formales" }
      desc: { en: "Specification languages, model checking and proof for systems where a bug is too expensive to find by testing.", pt-BR: "Linguagens de especificação, verificação de modelos e prova para sistemas em que um defeito é caro demais para achar por testes.", es: "Lenguajes de especificación, verificación de modelos y demostración para sistemas donde un defecto es demasiado caro de hallar por pruebas." }

- id: management
  name: { en: "Engineering Management", pt-BR: "Gestão de Engenharia", es: "Gestión de Ingeniería" }
  desc: { en: "Planning, estimating, leading and measuring software work, and growing the people who do it.", pt-BR: "Planejar, estimar, liderar e medir o trabalho de software, e desenvolver as pessoas que o fazem.", es: "Planificar, estimar, liderar y medir el trabajo de software, y hacer crecer a las personas que lo realizan." }
  children:
    - id: estimation
      name: { en: "Estimation and Planning", pt-BR: "Estimativa e Planejamento", es: "Estimación y Planificación" }
      desc: { en: "Relative sizing, forecasting from historical data, uncertainty and the honest communication of both.", pt-BR: "Dimensionamento relativo, previsão a partir de dados históricos, incerteza e a comunicação honesta de ambos.", es: "Dimensionamiento relativo, previsión a partir de datos históricos, incertidumbre y la comunicación honesta de ambas." }
    - id: risk
      name: { en: "Risk Management", pt-BR: "Gestão de Riscos", es: "Gestión de Riesgos" }
      desc: { en: "Identifying technical and delivery risks early and reducing them with spikes, prototypes and staged commitments.", pt-BR: "Identificar riscos técnicos e de entrega cedo e reduzi-los com spikes, protótipos e compromissos por etapas.", es: "Identificar riesgos técnicos y de entrega temprano y reducirlos con spikes, prototipos y compromisos por etapas." }
    - id: team-topologies
      name: { en: "Team Structure and Topologies", pt-BR: "Estrutura e Topologias de Times", es: "Estructura y Topologías de Equipos" }
      desc: { en: "Stream-aligned, platform and enabling teams, cognitive load and Conway's law as design constraints.", pt-BR: "Times alinhados a fluxo, de plataforma e habilitadores, carga cognitiva e a lei de Conway como restrições de projeto.", es: "Equipos alineados al flujo, de plataforma y habilitadores, carga cognitiva y la ley de Conway como restricciones de diseño." }
    - id: technical-leadership
      name: { en: "Technical Leadership", pt-BR: "Liderança Técnica", es: "Liderazgo Técnico" }
      desc: { en: "Setting direction, making and delegating decisions, mentoring, and orchestrating people and AI systems.", pt-BR: "Definir direção, tomar e delegar decisões, orientar pessoas, e orquestrar pessoas e sistemas de IA.", es: "Fijar la dirección, tomar y delegar decisiones, orientar personas y orquestar personas y sistemas de IA." }
    - id: metrics
      name: { en: "Engineering Metrics", pt-BR: "Métricas de Engenharia", es: "Métricas de Ingeniería" }
      desc: { en: "Delivery, quality and developer experience measures, and the pitfalls of turning any of them into targets.", pt-BR: "Medidas de entrega, qualidade e experiência do desenvolvedor, e as armadilhas de transformar qualquer uma delas em meta.", es: "Medidas de entrega, calidad y experiencia del desarrollador, y las trampas de convertir cualquiera de ellas en meta." }
    - id: economics
      name: { en: "Software Economics", pt-BR: "Economia de Software", es: "Economía de Software" }
      desc: { en: "Cost of ownership, build versus buy, return on investment and the financial reading of technical decisions.", pt-BR: "Custo de propriedade, construir versus comprar, retorno sobre o investimento e a leitura financeira de decisões técnicas.", es: "Costo de propiedad, construir frente a comprar, retorno de la inversión y la lectura financiera de las decisiones técnicas." }

- id: hci
  name: { en: "Human-Computer Interaction and UX", pt-BR: "Interação Humano-Computador e UX", es: "Interacción Humano-Computador y UX" }
  desc: { en: "Designing software around the people who use it: research, interaction design, accessibility and evaluation.", pt-BR: "Projetar software em torno das pessoas que o usam: pesquisa, projeto de interação, acessibilidade e avaliação.", es: "Diseñar software en torno a las personas que lo usan: investigación, diseño de interacción, accesibilidad y evaluación." }
  children:
    - id: user-research
      name: { en: "User Research", pt-BR: "Pesquisa com Usuários", es: "Investigación de Usuarios" }
      desc: { en: "Interviews, usability tests and analytics to learn what people actually do rather than what they say.", pt-BR: "Entrevistas, testes de usabilidade e analytics para descobrir o que as pessoas de fato fazem, e não o que dizem.", es: "Entrevistas, pruebas de usabilidad y analítica para descubrir lo que las personas hacen de verdad y no lo que dicen." }
    - id: interaction-design
      name: { en: "Interaction and Interface Design", pt-BR: "Projeto de Interação e Interface", es: "Diseño de Interacción e Interfaz" }
      desc: { en: "Information architecture, navigation, feedback and the patterns that make interfaces predictable.", pt-BR: "Arquitetura da informação, navegação, feedback e os padrões que tornam as interfaces previsíveis.", es: "Arquitectura de la información, navegación, retroalimentación y los patrones que hacen predecibles las interfaces." }
    - id: accessibility
      name: { en: "Accessibility", pt-BR: "Acessibilidade", es: "Accesibilidad" }
      desc: { en: "WCAG, assistive technologies and inclusive design so software works for people with every kind of ability.", pt-BR: "WCAG, tecnologias assistivas e design inclusivo para que o software funcione para pessoas com todo tipo de capacidade.", es: "WCAG, tecnologías de asistencia y diseño inclusivo para que el software funcione para personas con toda clase de capacidades." }
    - id: design-systems
      name: { en: "Design Systems", pt-BR: "Sistemas de Design", es: "Sistemas de Diseño" }
      desc: { en: "Shared components, tokens and guidelines that keep products consistent and teams fast.", pt-BR: "Componentes, tokens e diretrizes compartilhados que mantêm produtos consistentes e times rápidos.", es: "Componentes, tokens y directrices compartidos que mantienen los productos consistentes y los equipos rápidos." }
    - id: conversational-ux
      name: { en: "Conversational and AI-mediated Interfaces", pt-BR: "Interfaces Conversacionais e Mediadas por IA", es: "Interfaces Conversacionales y Mediadas por IA" }
      desc: { en: "Designing for intent, uncertainty and confirmation when a model, not a form, stands between the user and the system.", pt-BR: "Projetar para intenção, incerteza e confirmação quando um modelo, e não um formulário, fica entre o usuário e o sistema.", es: "Diseñar para la intención, la incertidumbre y la confirmación cuando un modelo, y no un formulario, media entre el usuario y el sistema." }

- id: ai-systems
  name: { en: "AI and Machine Learning Systems", pt-BR: "Sistemas de IA e Aprendizado de Máquina", es: "Sistemas de IA y Aprendizaje Automático" }
  desc: { en: "Engineering software whose behaviour is learned from data: models, pipelines, evaluation and operation.", pt-BR: "Engenharia de software cujo comportamento é aprendido de dados: modelos, pipelines, avaliação e operação.", es: "Ingeniería de software cuyo comportamiento se aprende de los datos: modelos, pipelines, evaluación y operación." }
  children:
    - id: ml-fundamentals
      name: { en: "Machine Learning Fundamentals", pt-BR: "Fundamentos de Aprendizado de Máquina", es: "Fundamentos de Aprendizaje Automático" }
      desc: { en: "Supervised, unsupervised and reinforcement learning, generalisation, bias and variance, and how models are trained.", pt-BR: "Aprendizado supervisionado, não supervisionado e por reforço, generalização, viés e variância, e como os modelos são treinados.", es: "Aprendizaje supervisado, no supervisado y por refuerzo, generalización, sesgo y varianza, y cómo se entrenan los modelos." }
    - id: generative-ai
      name: { en: "Generative AI and Large Language Models", pt-BR: "IA Generativa e Grandes Modelos de Linguagem", es: "IA Generativa y Grandes Modelos de Lenguaje" }
      desc: { en: "Transformers, attention, prompting, retrieval and agents, and what changes when generation becomes a component.", pt-BR: "Transformers, atenção, prompting, recuperação e agents, e o que muda quando a geração vira um componente.", es: "Transformers, atención, prompting, recuperación y agents, y qué cambia cuando la generación se vuelve un componente." }
    - id: mlops
      name: { en: "MLOps and Model Lifecycle", pt-BR: "MLOps e Ciclo de Vida de Modelos", es: "MLOps y Ciclo de Vida de Modelos" }
      desc: { en: "Versioning data and models, training pipelines, deployment, monitoring for drift and retraining.", pt-BR: "Versionar dados e modelos, pipelines de treinamento, implantação, monitoramento de desvio e retreinamento.", es: "Versionar datos y modelos, pipelines de entrenamiento, despliegue, monitoreo de deriva y reentrenamiento." }
    - id: evaluation
      name: { en: "Evaluation and Guardrails", pt-BR: "Avaliação e Guardrails", es: "Evaluación y Guardrails" }
      desc: { en: "Offline and online evaluation, test sets from real requests, human review and controls on what a model may do.", pt-BR: "Avaliação offline e online, conjuntos de teste a partir de requisições reais, revisão humana e controles sobre o que um modelo pode fazer.", es: "Evaluación offline y online, conjuntos de prueba a partir de solicitudes reales, revisión humana y controles sobre lo que un modelo puede hacer." }
    - id: responsible-ai
      name: { en: "Responsible and Trustworthy AI", pt-BR: "IA Responsável e Confiável", es: "IA Responsable y Confiable" }
      desc: { en: "Fairness, transparency, safety, data provenance and regulation as engineering requirements, not afterthoughts.", pt-BR: "Justiça, transparência, segurança, proveniência de dados e regulação como requisitos de engenharia, não como acréscimos tardios.", es: "Equidad, transparencia, seguridad, procedencia de los datos y regulación como requisitos de ingeniería y no como añadidos tardíos." }

- id: profession
  name: { en: "Professional Practice", pt-BR: "Prática Profissional", es: "Práctica Profesional" }
  desc: { en: "What it means to work as an engineer: ethics, communication, collaboration, learning and the shape of a career.", pt-BR: "O que significa trabalhar como engenheiro: ética, comunicação, colaboração, aprendizado e a forma de uma carreira.", es: "Lo que significa trabajar como ingeniero: ética, comunicación, colaboración, aprendizaje y la forma de una carrera." }
  children:
    - id: ethics
      name: { en: "Ethics and Responsibility", pt-BR: "Ética e Responsabilidade", es: "Ética y Responsabilidad" }
      desc: { en: "Codes of ethics, the impact of software on people and society, and the duty to speak up about risk.", pt-BR: "Códigos de ética, o impacto do software sobre pessoas e sociedade, e o dever de alertar sobre riscos.", es: "Códigos de ética, el impacto del software sobre las personas y la sociedad, y el deber de advertir sobre los riesgos." }
    - id: communication
      name: { en: "Communication and Technical Writing", pt-BR: "Comunicação e Escrita Técnica", es: "Comunicación y Escritura Técnica" }
      desc: { en: "Explaining decisions, writing proposals and reviews, and adapting the message to engineers and non-engineers.", pt-BR: "Explicar decisões, escrever propostas e revisões, e adaptar a mensagem para engenheiros e não engenheiros.", es: "Explicar decisiones, escribir propuestas y revisiones, y adaptar el mensaje a ingenieros y no ingenieros." }
    - id: collaboration
      name: { en: "Collaboration and Remote Work", pt-BR: "Colaboração e Trabalho Remoto", es: "Colaboración y Trabajo Remoto" }
      desc: { en: "Pairing, mobbing, asynchronous communication and the norms that keep distributed teams effective.", pt-BR: "Programação em par, mob programming, comunicação assíncrona e as normas que mantêm times distribuídos eficazes.", es: "Programación en pareja, mob programming, comunicación asíncrona y las normas que mantienen eficaces a los equipos distribuidos." }
    - id: open-source
      name: { en: "Open Source and Licensing", pt-BR: "Código Aberto e Licenciamento", es: "Código Abierto y Licenciamiento" }
      desc: { en: "Contributing to and depending on open source, licence compatibility and intellectual property basics.", pt-BR: "Contribuir com e depender de código aberto, compatibilidade de licenças e noções de propriedade intelectual.", es: "Contribuir a y depender del código abierto, compatibilidad de licencias y nociones de propiedad intelectual." }
    - id: continuous-learning
      name: { en: "Continuous Learning and Career", pt-BR: "Aprendizado Contínuo e Carreira", es: "Aprendizaje Continuo y Carrera" }
      desc: { en: "Triage of a fast-moving field, deliberate practice, mentoring and the paths from individual contributor to leadership.", pt-BR: "Triagem de um campo em movimento rápido, prática deliberada, mentoria e os caminhos de contribuidor individual à liderança.", es: "Triaje de un campo que se mueve rápido, práctica deliberada, mentoría y los caminos de contribuidor individual al liderazgo." }
