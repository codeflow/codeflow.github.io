  desc: { en: "Storing, modelling, moving and protecting data, the asset that outlives every application built on top of it.", pt-BR: "Armazenar, modelar, mover e proteger dados, o ativo que sobrevive a toda aplicação construída sobre ele.", es: "Almacenar, modelar, mover y proteger los datos, el activo que sobrevive a toda aplicación construida sobre ellos." }
  children:
    - id: relational
