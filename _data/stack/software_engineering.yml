# Content stack — Software Engineering. Internal planning map: topics and subtopics with a one-sentence scope each.
# Names and descriptions in every site language (en, pt-BR, es). Rendered by /stack/ (unpublished page).
- id: foundations
  name: { en: "Computing Foundations", pt-BR: "Fundamentos de Computação", es: "Fundamentos de Computación" }
  desc: { en: "The theory and machinery every engineer builds on: how programs are represented, executed and bounded.", pt-BR: "A teoria e a maquinaria sobre as quais todo engenheiro constrói: como programas são representados, executados e limitados.", es: "La teoría y la maquinaria sobre las que construye todo ingeniero: cómo se representan, ejecutan y acotan los programas." }
  children:
    - id: algorithms
      name: { en: "Algorithms and Complexity", pt-BR: "Algoritmos e Complexidade", es: "Algoritmos y Complejidad" }
      desc: { en: "Designing procedures that solve problems correctly and analysing their time and space cost with asymptotic notation.", pt-BR: "Projetar procedimentos que resolvem problemas corretamente e analisar seu custo de tempo e espaço com notação assintótica.", es: "Diseñar procedimientos que resuelven problemas correctamente y analizar su costo en tiempo y espacio con notación asintótica." }
    - id: data-structures
      name: { en: "Data Structures", pt-BR: "Estruturas de Dados", es: "Estructuras de Datos" }
      desc: { en: "Arrays, lists, trees, hashes and graphs: how data is organised in memory and what each layout makes cheap or expensive.", pt-BR: "Vetores, listas, árvores, hashes e grafos: como os dados são organizados na memória e o que cada arranjo torna barato ou caro.", es: "Arreglos, listas, árboles, hashes y grafos: cómo se organizan los datos en memoria y qué vuelve barato o caro cada disposición." }
    - id: computer-architecture
      name: { en: "Computer Architecture", pt-BR: "Arquitetura de Computadores", es: "Arquitectura de Computadores" }
      desc: { en: "Processors, memory hierarchy, caches and I/O: the hardware model that explains why some code is fast and some is not.", pt-BR: "Processadores, hierarquia de memória, caches e E/S: o modelo de hardware que explica por que certo código é rápido e outro não.", es: "Procesadores, jerarquía de memoria, cachés y E/S: el modelo de hardware que explica por qué cierto código es rápido y otro no." }
    - id: operating-systems
      name: { en: "Operating Systems", pt-BR: "Sistemas Operacionais", es: "Sistemas Operativos" }
      desc: { en: "Processes, threads, scheduling, virtual memory and file systems, and how applications negotiate with the kernel.", pt-BR: "Processos, threads, escalonamento, memória virtual e sistemas de arquivos, e como as aplicações negociam com o kernel.", es: "Procesos, hilos, planificación, memoria virtual y sistemas de archivos, y cómo las aplicaciones negocian con el núcleo." }
    - id: networks
      name: { en: "Computer Networks", pt-BR: "Redes de Computadores", es: "Redes de Computadores" }
      desc: { en: "The protocol stack from IP to HTTP, latency and bandwidth, and the failure modes that distributed software inherits from the wire.", pt-BR: "A pilha de protocolos do IP ao HTTP, latência e largura de banda, e os modos de falha que o software distribuído herda do cabo.", es: "La pila de protocolos del IP al HTTP, latencia y ancho de banda, y los modos de falla que el software distribuido hereda del cable." }
    - id: compilers
      name: { en: "Languages, Compilers and Runtimes", pt-BR: "Linguagens, Compiladores e Runtimes", es: "Lenguajes, Compiladores y Runtimes" }
      desc: { en: "How source code becomes executable behaviour: parsing, type systems, code generation, garbage collection and virtual machines.", pt-BR: "Como o código-fonte vira comportamento executável: análise sintática, sistemas de tipos, geração de código, coleta de lixo e máquinas virtuais.", es: "Cómo el código fuente se convierte en comportamiento ejecutable: análisis sintáctico, sistemas de tipos, generación de código, recolección de basura y máquinas virtuales." }
    - id: discrete-math
      name: { en: "Discrete Mathematics and Logic", pt-BR: "Matemática Discreta e Lógica", es: "Matemática Discreta y Lógica" }
      desc: { en: "Sets, relations, graphs, combinatorics and propositional logic as the vocabulary of specifications, proofs and data models.", pt-BR: "Conjuntos, relações, grafos, combinatória e lógica proposicional como o vocabulário de especificações, provas e modelos de dados.", es: "Conjuntos, relaciones, grafos, combinatoria y lógica proposicional como el vocabulario de especificaciones, pruebas y modelos de datos." }

- id: requirements
  name: { en: "Requirements Engineering", pt-BR: "Engenharia de Requisitos", es: "Ingeniería de Requisitos" }
  desc: { en: "Discovering, negotiating, specifying and validating what a system must do and how well, before and while it is built.", pt-BR: "Descobrir, negociar, especificar e validar o que um sistema deve fazer e quão bem, antes e durante a construção.", es: "Descubrir, negociar, especificar y validar qué debe hacer un sistema y con qué calidad, antes y durante su construcción." }
  children:
    - id: elicitation
      name: { en: "Elicitation and Discovery", pt-BR: "Elicitação e Descoberta", es: "Elicitación y Descubrimiento" }
      desc: { en: "Interviews, workshops, observation and document analysis to surface needs that stakeholders cannot state on their own.", pt-BR: "Entrevistas, workshops, observação e análise de documentos para revelar necessidades que os interessados não conseguem enunciar sozinhos.", es: "Entrevistas, talleres, observación y análisis de documentos para sacar a la luz necesidades que los interesados no logran enunciar por sí solos." }
    - id: analysis
      name: { en: "Analysis and Negotiation", pt-BR: "Análise e Negociação", es: "Análisis y Negociación" }
      desc: { en: "Resolving conflicts, priorities and trade-offs among stakeholders so the requirement set is consistent and feasible.", pt-BR: "Resolver conflitos, prioridades e trade-offs entre os interessados para que o conjunto de requisitos seja consistente e viável.", es: "Resolver conflictos, prioridades y compromisos entre interesados para que el conjunto de requisitos sea consistente y factible." }
    - id: specification
      name: { en: "Specification and User Stories", pt-BR: "Especificação e Histórias de Usuário", es: "Especificación e Historias de Usuario" }
      desc: { en: "Writing requirements that are unambiguous and testable, from formal documents to user stories with acceptance criteria.", pt-BR: "Escrever requisitos sem ambiguidade e testáveis, de documentos formais a histórias de usuário com critérios de aceite.", es: "Escribir requisitos sin ambigüedad y comprobables, desde documentos formales hasta historias de usuario con criterios de aceptación." }
    - id: nfr
      name: { en: "Quality Attributes (Non-functional Requirements)", pt-BR: "Atributos de Qualidade (Requisitos Não Funcionais)", es: "Atributos de Calidad (Requisitos No Funcionales)" }
      desc: { en: "Performance, availability, security, usability and other -ilities, expressed as measurable targets that drive architecture.", pt-BR: "Desempenho, disponibilidade, segurança, usabilidade e outros atributos, expressos como metas mensuráveis que orientam a arquitetura.", es: "Rendimiento, disponibilidad, seguridad, usabilidad y otros atributos, expresados como metas medibles que orientan la arquitectura." }
    - id: validation
      name: { en: "Validation and Acceptance", pt-BR: "Validação e Aceite", es: "Validación y Aceptación" }
      desc: { en: "Confirming with stakeholders that the specified system is the right one, through reviews, prototypes and acceptance tests.", pt-BR: "Confirmar com os interessados que o sistema especificado é o certo, por revisões, protótipos e testes de aceite.", es: "Confirmar con los interesados que el sistema especificado es el correcto, mediante revisiones, prototipos y pruebas de aceptación." }
    - id: traceability
      name: { en: "Traceability and Change", pt-BR: "Rastreabilidade e Mudança", es: "Trazabilidad y Cambio" }
      desc: { en: "Linking requirements to design, code and tests, and managing their evolution as the product and the business change.", pt-BR: "Ligar requisitos a projeto, código e testes, e administrar sua evolução conforme produto e negócio mudam.", es: "Vincular requisitos con diseño, código y pruebas, y administrar su evolución a medida que cambian el producto y el negocio." }
    - id: domain-modeling
      name: { en: "Domain Modelling", pt-BR: "Modelagem de Domínio", es: "Modelado de Dominio" }
      desc: { en: "Capturing the concepts, rules and language of the business as a model shared by analysts and developers.", pt-BR: "Capturar conceitos, regras e linguagem do negócio num modelo compartilhado por analistas e desenvolvedores.", es: "Capturar los conceptos, reglas y lenguaje del negocio en un modelo compartido por analistas y desarrolladores." }

- id: design
  name: { en: "Software Design", pt-BR: "Projeto de Software", es: "Diseño de Software" }
  desc: { en: "Turning requirements into a structure of components, interfaces and responsibilities that can be built and changed.", pt-BR: "Transformar requisitos numa estrutura de componentes, interfaces e responsabilidades que possa ser construída e alterada.", es: "Convertir requisitos en una estructura de componentes, interfaces y responsabilidades que pueda construirse y cambiarse." }
  children:
    - id: principles
      name: { en: "Design Principles", pt-BR: "Princípios de Projeto", es: "Principios de Diseño" }
      desc: { en: "Cohesion, coupling, information hiding, SOLID and the other rules of thumb that keep change local.", pt-BR: "Coesão, acoplamento, ocultação de informação, SOLID e as demais regras práticas que mantêm a mudança localizada.", es: "Cohesión, acoplamiento, ocultación de información, SOLID y las demás reglas prácticas que mantienen el cambio localizado." }
    - id: patterns
      name: { en: "Design Patterns", pt-BR: "Padrões de Projeto", es: "Patrones de Diseño" }
      desc: { en: "Named, reusable solutions to recurring design problems, from the classic catalogue to language-specific idioms.", pt-BR: "Soluções nomeadas e reutilizáveis para problemas recorrentes de projeto, do catálogo clássico aos idiomas de cada linguagem.", es: "Soluciones nombradas y reutilizables para problemas recurrentes de diseño, desde el catálogo clásico hasta los modismos de cada lenguaje." }
    - id: oo-design
      name: { en: "Object-Oriented Design", pt-BR: "Projeto Orientado a Objetos", es: "Diseño Orientado a Objetos" }
      desc: { en: "Classes, responsibilities, collaborations, inheritance versus composition, and how to model behaviour with objects.", pt-BR: "Classes, responsabilidades, colaborações, herança versus composição, e como modelar comportamento com objetos.", es: "Clases, responsabilidades, colaboraciones, herencia frente a composición, y cómo modelar comportamiento con objetos." }
    - id: functional-design
      name: { en: "Functional and Reactive Design", pt-BR: "Projeto Funcional e Reativo", es: "Diseño Funcional y Reactivo" }
      desc: { en: "Immutability, pure functions, composition and streams as a way to structure programs that are easier to reason about.", pt-BR: "Imutabilidade, funções puras, composição e fluxos como forma de estruturar programas mais fáceis de raciocinar.", es: "Inmutabilidad, funciones puras, composición y flujos como forma de estructurar programas más fáciles de razonar." }
    - id: ddd
      name: { en: "Domain-Driven Design", pt-BR: "Domain-Driven Design", es: "Diseño Guiado por el Dominio" }
      desc: { en: "Bounded contexts, aggregates, ubiquitous language and strategic design for systems whose complexity lives in the business.", pt-BR: "Contextos delimitados, agregados, linguagem ubíqua e projeto estratégico para sistemas cuja complexidade está no negócio.", es: "Contextos delimitados, agregados, lenguaje ubicuo y diseño estratégico para sistemas cuya complejidad vive en el negocio." }
    - id: api-design
      name: { en: "API and Interface Design", pt-BR: "Projeto de APIs e Interfaces", es: "Diseño de APIs e Interfaces" }
      desc: { en: "Contracts between components and teams: REST, GraphQL, gRPC, versioning, error handling and backward compatibility.", pt-BR: "Contratos entre componentes e times: REST, GraphQL, gRPC, versionamento, tratamento de erros e compatibilidade retroativa.", es: "Contratos entre componentes y equipos: REST, GraphQL, gRPC, versionado, manejo de errores y compatibilidad hacia atrás." }
    - id: modeling-notations
      name: { en: "Modelling Notations", pt-BR: "Notações de Modelagem", es: "Notaciones de Modelado" }
      desc: { en: "UML, C4 and other diagrams as tools for thinking and communicating structure and behaviour, not as ends in themselves.", pt-BR: "UML, C4 e outros diagramas como ferramentas para pensar e comunicar estrutura e comportamento, não como fins em si.", es: "UML, C4 y otros diagramas como herramientas para pensar y comunicar estructura y comportamiento, no como fines en sí mismos." }

- id: architecture
  name: { en: "Software Architecture", pt-BR: "Arquitetura de Software", es: "Arquitectura de Software" }
  desc: { en: "The decisions that are expensive to change: system decomposition, styles, integration and the trade-offs among quality attributes.", pt-BR: "As decisões caras de mudar: decomposição do sistema, estilos, integração e os trade-offs entre atributos de qualidade.", es: "Las decisiones caras de cambiar: descomposición del sistema, estilos, integración y los compromisos entre atributos de calidad." }
  children:
    - id: styles
      name: { en: "Architectural Styles", pt-BR: "Estilos Arquiteturais", es: "Estilos Arquitectónicos" }
      desc: { en: "Layered, hexagonal, microkernel, event-driven, monolith and microservices: what each optimises for and what it costs.", pt-BR: "Em camadas, hexagonal, microkernel, orientado a eventos, monólito e microsserviços: o que cada um otimiza e o que custa.", es: "En capas, hexagonal, micronúcleo, orientado a eventos, monolito y microservicios: qué optimiza cada uno y qué cuesta." }
    - id: decisions
      name: { en: "Architectural Decisions and Documentation", pt-BR: "Decisões Arquiteturais e Documentação", es: "Decisiones Arquitectónicas y Documentación" }
      desc: { en: "Recording the why behind the structure with decision records, views and lightweight architecture documents.", pt-BR: "Registrar o porquê da estrutura com registros de decisão, visões e documentos de arquitetura enxutos.", es: "Registrar el porqué de la estructura con registros de decisión, vistas y documentos de arquitectura ligeros." }
    - id: quality-tradeoffs
      name: { en: "Quality Attribute Trade-offs", pt-BR: "Trade-offs entre Atributos de Qualidade", es: "Compromisos entre Atributos de Calidad" }
      desc: { en: "Evaluating architectures against scenarios of performance, availability, modifiability and security, and choosing deliberately.", pt-BR: "Avaliar arquiteturas contra cenários de desempenho, disponibilidade, modificabilidade e segurança, e escolher de forma deliberada.", es: "Evaluar arquitecturas frente a escenarios de rendimiento, disponibilidad, modificabilidad y seguridad, y elegir de forma deliberada." }
    - id: integration
      name: { en: "Integration and Messaging", pt-BR: "Integração e Mensageria", es: "Integración y Mensajería" }
      desc: { en: "Synchronous and asynchronous communication, queues, event streams, sagas and the consistency models each implies.", pt-BR: "Comunicação síncrona e assíncrona, filas, fluxos de eventos, sagas e os modelos de consistência que cada um implica.", es: "Comunicación síncrona y asíncrona, colas, flujos de eventos, sagas y los modelos de consistencia que cada uno implica." }
    - id: modular-monolith
      name: { en: "Modularity and Service Boundaries", pt-BR: "Modularidade e Fronteiras de Serviço", es: "Modularidad y Fronteras de Servicio" }
      desc: { en: "Drawing boundaries that follow the domain and the team structure, and knowing when to split a system and when not to.", pt-BR: "Traçar fronteiras que seguem o domínio e a estrutura dos times, e saber quando dividir um sistema e quando não.", es: "Trazar fronteras que siguen el dominio y la estructura de los equipos, y saber cuándo dividir un sistema y cuándo no." }
    - id: evolution
      name: { en: "Evolutionary Architecture", pt-BR: "Arquitetura Evolutiva", es: "Arquitectura Evolutiva" }
      desc: { en: "Fitness functions, incremental change and migration strategies that let the architecture change without a rewrite.", pt-BR: "Funções de aptidão, mudança incremental e estratégias de migração que permitem a arquitetura mudar sem reescrita.", es: "Funciones de aptitud, cambio incremental y estrategias de migración que permiten cambiar la arquitectura sin reescribirla." }
    - id: frontend-architecture
      name: { en: "Front-end and Client Architecture", pt-BR: "Arquitetura de Front-end e Clientes", es: "Arquitectura de Front-end y Clientes" }
      desc: { en: "State management, rendering strategies, component models and the split of responsibilities between client and server.", pt-BR: "Gestão de estado, estratégias de renderização, modelos de componentes e a divisão de responsabilidades entre cliente e servidor.", es: "Gestión de estado, estrategias de renderizado, modelos de componentes y el reparto de responsabilidades entre cliente y servidor." }

- id: construction
  name: { en: "Software Construction", pt-BR: "Construção de Software", es: "Construcción de Software" }
  desc: { en: "The craft of writing code that works, reads well and survives its authors: languages, tools, habits and reviews.", pt-BR: "O ofício de escrever código que funciona, lê bem e sobrevive aos autores: linguagens, ferramentas, hábitos e revisões.", es: "El oficio de escribir código que funciona, se lee bien y sobrevive a sus autores: lenguajes, herramientas, hábitos y revisiones." }
  children:
    - id: paradigms
      name: { en: "Programming Paradigms and Languages", pt-BR: "Paradigmas e Linguagens de Programação", es: "Paradigmas y Lenguajes de Programación" }
      desc: { en: "Imperative, object-oriented, functional and logic styles, and how a language's model shapes the programs written in it.", pt-BR: "Estilos imperativo, orientado a objetos, funcional e lógico, e como o modelo de uma linguagem molda os programas escritos nela.", es: "Estilos imperativo, orientado a objetos, funcional y lógico, y cómo el modelo de un lenguaje moldea los programas escritos en él." }
    - id: clean-code
      name: { en: "Readable Code and Conventions", pt-BR: "Código Legível e Convenções", es: "Código Legible y Convenciones" }
      desc: { en: "Naming, structure, comments and style guides that make code understandable to the next person, including its author.", pt-BR: "Nomes, estrutura, comentários e guias de estilo que tornam o código compreensível para a próxima pessoa, inclusive o autor.", es: "Nombres, estructura, comentarios y guías de estilo que hacen el código comprensible para la siguiente persona, incluido su autor." }
    - id: error-handling
      name: { en: "Error Handling and Robustness", pt-BR: "Tratamento de Erros e Robustez", es: "Manejo de Errores y Robustez" }
      desc: { en: "Exceptions, result types, defensive programming, retries and the discipline of failing loudly and recovering safely.", pt-BR: "Exceções, tipos de resultado, programação defensiva, novas tentativas e a disciplina de falhar de forma visível e recuperar com segurança.", es: "Excepciones, tipos de resultado, programación defensiva, reintentos y la disciplina de fallar de forma visible y recuperarse con seguridad." }
    - id: concurrency
      name: { en: "Concurrency and Parallelism", pt-BR: "Concorrência e Paralelismo", es: "Concurrencia y Paralelismo" }
      desc: { en: "Threads, async models, locks, actors and data races: getting correctness before speed when many things happen at once.", pt-BR: "Threads, modelos assíncronos, travas, atores e condições de corrida: obter correção antes de velocidade quando muita coisa acontece ao mesmo tempo.", es: "Hilos, modelos asíncronos, bloqueos, actores y condiciones de carrera: lograr corrección antes que velocidad cuando muchas cosas ocurren a la vez." }
    - id: refactoring
      name: { en: "Refactoring", pt-BR: "Refatoração", es: "Refactorización" }
      desc: { en: "Improving the internal structure of code in small, behaviour-preserving steps backed by tests.", pt-BR: "Melhorar a estrutura interna do código em passos pequenos que preservam o comportamento, apoiados por testes.", es: "Mejorar la estructura interna del código en pasos pequeños que preservan el comportamiento, respaldados por pruebas." }
    - id: code-review
      name: { en: "Code Review", pt-BR: "Revisão de Código", es: "Revisión de Código" }
      desc: { en: "Reviewing for correctness, design and knowledge sharing, with practices that keep reviews fast and respectful.", pt-BR: "Revisar por correção, projeto e compartilhamento de conhecimento, com práticas que mantêm as revisões rápidas e respeitosas.", es: "Revisar por corrección, diseño e intercambio de conocimiento, con prácticas que mantienen las revisiones rápidas y respetuosas." }
    - id: tooling
      name: { en: "Developer Tooling", pt-BR: "Ferramentas do Desenvolvedor", es: "Herramientas del Desarrollador" }
      desc: { en: "Editors, debuggers, linters, formatters, build tools and package managers as multipliers of individual productivity.", pt-BR: "Editores, depuradores, linters, formatadores, ferramentas de build e gerenciadores de pacotes como multiplicadores da produtividade individual.", es: "Editores, depuradores, linters, formateadores, herramientas de build y gestores de paquetes como multiplicadores de la productividad individual." }
    - id: ai-assisted
      name: { en: "AI-assisted Development", pt-BR: "Desenvolvimento Assistido por IA", es: "Desarrollo Asistido por IA" }
      desc: { en: "Using code assistants and agents for drafts, tests and exploration while keeping judgement, review and ownership with people.", pt-BR: "Usar assistentes de código e agents para rascunhos, testes e exploração mantendo julgamento, revisão e responsabilidade com pessoas.", es: "Usar asistentes de código y agents para borradores, pruebas y exploración manteniendo el juicio, la revisión y la responsabilidad en las personas." }

- id: testing
  name: { en: "Software Testing", pt-BR: "Testes de Software", es: "Pruebas de Software" }
  desc: { en: "Gaining justified confidence that the software does what it should, at every level from a function to the whole system.", pt-BR: "Obter confiança justificada de que o software faz o que deve, em todos os níveis, de uma função ao sistema inteiro.", es: "Obtener confianza justificada de que el software hace lo que debe, en todos los niveles, de una función al sistema completo." }
  children:
    - id: test-levels
      name: { en: "Test Levels and the Pyramid", pt-BR: "Níveis de Teste e a Pirâmide", es: "Niveles de Prueba y la Pirámide" }
      desc: { en: "Unit, integration, contract, end-to-end and exploratory tests, and how to balance them for speed and coverage.", pt-BR: "Testes unitários, de integração, de contrato, ponta a ponta e exploratórios, e como equilibrá-los entre velocidade e cobertura.", es: "Pruebas unitarias, de integración, de contrato, de extremo a extremo y exploratorias, y cómo equilibrarlas entre velocidad y cobertura." }
    - id: tdd
      name: { en: "Test-Driven and Behaviour-Driven Development", pt-BR: "Desenvolvimento Guiado por Testes e por Comportamento", es: "Desarrollo Guiado por Pruebas y por Comportamiento" }
      desc: { en: "Writing tests before code to drive design, and expressing behaviour in examples the business can read.", pt-BR: "Escrever testes antes do código para guiar o projeto, e expressar comportamento em exemplos que o negócio consegue ler.", es: "Escribir pruebas antes del código para guiar el diseño, y expresar el comportamiento en ejemplos que el negocio puede leer." }
    - id: test-design
      name: { en: "Test Design Techniques", pt-BR: "Técnicas de Projeto de Testes", es: "Técnicas de Diseño de Pruebas" }
      desc: { en: "Equivalence classes, boundary values, state machines, property-based and mutation testing to choose the cases that matter.", pt-BR: "Classes de equivalência, valores-limite, máquinas de estado, testes baseados em propriedades e de mutação para escolher os casos que importam.", es: "Clases de equivalencia, valores límite, máquinas de estado, pruebas basadas en propiedades y de mutación para elegir los casos que importan." }
    - id: test-doubles
      name: { en: "Test Doubles and Isolation", pt-BR: "Dublês de Teste e Isolamento", es: "Dobles de Prueba y Aislamiento" }
      desc: { en: "Stubs, mocks, fakes and contract tests, and the risk of testing the mocks instead of the system.", pt-BR: "Stubs, mocks, fakes e testes de contrato, e o risco de testar os mocks em vez do sistema.", es: "Stubs, mocks, fakes y pruebas de contrato, y el riesgo de probar los mocks en lugar del sistema." }
    - id: non-functional-testing
      name: { en: "Performance, Load and Security Testing", pt-BR: "Testes de Desempenho, Carga e Segurança", es: "Pruebas de Rendimiento, Carga y Seguridad" }
      desc: { en: "Verifying quality attributes under realistic conditions: throughput, latency, resource use and resistance to attack.", pt-BR: "Verificar atributos de qualidade em condições realistas: vazão, latência, uso de recursos e resistência a ataques.", es: "Verificar atributos de calidad en condiciones realistas: rendimiento, latencia, uso de recursos y resistencia a ataques." }
    - id: test-automation
      name: { en: "Test Automation and Flakiness", pt-BR: "Automação de Testes e Instabilidade", es: "Automatización de Pruebas e Inestabilidad" }
      desc: { en: "Building suites that run on every change, stay fast and trustworthy, and are treated as production code.", pt-BR: "Construir suítes que rodam a cada mudança, permanecem rápidas e confiáveis, e são tratadas como código de produção.", es: "Construir suites que corren en cada cambio, se mantienen rápidas y confiables, y se tratan como código de producción." }
    - id: testing-in-production
      name: { en: "Testing in Production", pt-BR: "Testes em Produção", es: "Pruebas en Producción" }
      desc: { en: "Canary releases, feature flags, synthetic monitoring and chaos experiments as tests that only the real environment can run.", pt-BR: "Lançamentos canário, feature flags, monitoramento sintético e experimentos de caos como testes que só o ambiente real consegue rodar.", es: "Lanzamientos canario, feature flags, monitoreo sintético y experimentos de caos como pruebas que solo el entorno real puede ejecutar." }

- id: quality
  name: { en: "Software Quality", pt-BR: "Qualidade de Software", es: "Calidad de Software" }
  desc: { en: "Defining, measuring and assuring quality as a property of the product and the process, beyond finding bugs.", pt-BR: "Definir, medir e assegurar qualidade como propriedade do produto e do processo, para além de encontrar defeitos.", es: "Definir, medir y asegurar la calidad como propiedad del producto y del proceso, más allá de encontrar defectos." }
  children:
    - id: quality-models
      name: { en: "Quality Models and Standards", pt-BR: "Modelos e Normas de Qualidade", es: "Modelos y Normas de Calidad" }
      desc: { en: "ISO 25010 and similar frameworks that name the dimensions of quality and make them discussable and measurable.", pt-BR: "ISO 25010 e frameworks semelhantes que nomeiam as dimensões da qualidade e as tornam discutíveis e mensuráveis.", es: "ISO 25010 y marcos similares que nombran las dimensiones de la calidad y las vuelven discutibles y medibles." }
    - id: static-analysis
      name: { en: "Static Analysis and Code Metrics", pt-BR: "Análise Estática e Métricas de Código", es: "Análisis Estático y Métricas de Código" }
      desc: { en: "Complexity, duplication, dependency and smell metrics, and the tools that flag them before a human reads the code.", pt-BR: "Métricas de complexidade, duplicação, dependência e maus cheiros, e as ferramentas que as apontam antes de um humano ler o código.", es: "Métricas de complejidad, duplicación, dependencias y malos olores, y las herramientas que las señalan antes de que un humano lea el código." }
    - id: reviews-inspections
      name: { en: "Reviews, Inspections and Audits", pt-BR: "Revisões, Inspeções e Auditorias", es: "Revisiones, Inspecciones y Auditorías" }
      desc: { en: "Structured examination of artefacts, from lightweight peer review to formal inspection and compliance audits.", pt-BR: "Exame estruturado de artefatos, da revisão leve por pares à inspeção formal e às auditorias de conformidade.", es: "Examen estructurado de artefactos, desde la revisión ligera entre pares hasta la inspección formal y las auditorías de cumplimiento." }
    - id: technical-debt
      name: { en: "Technical Debt", pt-BR: "Débito Técnico", es: "Deuda Técnica" }
      desc: { en: "Recognising, quantifying and paying down the shortcuts that slow future change, and deciding which debt to keep.", pt-BR: "Reconhecer, quantificar e pagar os atalhos que retardam mudanças futuras, e decidir qual débito manter.", es: "Reconocer, cuantificar y pagar los atajos que frenan los cambios futuros, y decidir qué deuda conservar." }
    - id: defect-management
      name: { en: "Defect Management and Root Cause Analysis", pt-BR: "Gestão de Defeitos e Análise de Causa Raiz", es: "Gestión de Defectos y Análisis de Causa Raíz" }
      desc: { en: "Tracking, triaging and learning from defects so the same class of failure does not return.", pt-BR: "Registrar, triar e aprender com defeitos para que a mesma classe de falha não volte.", es: "Registrar, priorizar y aprender de los defectos para que la misma clase de falla no regrese." }
    - id: quality-culture
      name: { en: "Quality Culture and Definition of Done", pt-BR: "Cultura de Qualidade e Definição de Pronto", es: "Cultura de Calidad y Definición de Terminado" }
      desc: { en: "Shared standards, checklists and team agreements that make quality everyone's job rather than a final gate.", pt-BR: "Padrões compartilhados, checklists e acordos de time que tornam a qualidade tarefa de todos, e não um portão final.", es: "Estándares compartidos, listas de verificación y acuerdos de equipo que hacen de la calidad tarea de todos y no una puerta final." }

- id: maintenance
  name: { en: "Maintenance and Evolution", pt-BR: "Manutenção e Evolução", es: "Mantenimiento y Evolución" }
  desc: { en: "Keeping software useful and healthy after release, which is where most of its life and cost are spent.", pt-BR: "Manter o software útil e saudável depois do lançamento, onde a maior parte da vida e do custo dele é gasta.", es: "Mantener el software útil y sano después del lanzamiento, que es donde se gasta la mayor parte de su vida y su costo." }
  children:
    - id: maintenance-types
      name: { en: "Types of Maintenance", pt-BR: "Tipos de Manutenção", es: "Tipos de Mantenimiento" }
      desc: { en: "Corrective, adaptive, perfective and preventive work, and how each is planned and prioritised.", pt-BR: "Trabalho corretivo, adaptativo, perfectivo e preventivo, e como cada um é planejado e priorizado.", es: "Trabajo correctivo, adaptativo, perfectivo y preventivo, y cómo se planifica y prioriza cada uno." }
    - id: legacy
      name: { en: "Legacy Systems and Modernisation", pt-BR: "Sistemas Legados e Modernização", es: "Sistemas Heredados y Modernización" }
      desc: { en: "Characterisation tests, strangler patterns and incremental rewrites for systems nobody fully understands anymore.", pt-BR: "Testes de caracterização, padrão estrangulador e reescritas incrementais para sistemas que ninguém entende por completo.", es: "Pruebas de caracterización, patrón estrangulador y reescrituras incrementales para sistemas que ya nadie entiende del todo." }
    - id: comprehension
      name: { en: "Program Comprehension and Reverse Engineering", pt-BR: "Compreensão de Programas e Engenharia Reversa", es: "Comprensión de Programas e Ingeniería Inversa" }
      desc: { en: "Reading unfamiliar code, recovering design from artefacts, and building the mental model needed to change safely.", pt-BR: "Ler código desconhecido, recuperar o projeto a partir dos artefatos e construir o modelo mental necessário para mudar com segurança.", es: "Leer código desconocido, recuperar el diseño a partir de los artefactos y construir el modelo mental necesario para cambiar con seguridad." }
    - id: dependencies
      name: { en: "Dependency and Upgrade Management", pt-BR: "Gestão de Dependências e Atualizações", es: "Gestión de Dependencias y Actualizaciones" }
      desc: { en: "Keeping libraries, runtimes and platforms current without breaking the product, including vulnerability response.", pt-BR: "Manter bibliotecas, runtimes e plataformas atualizados sem quebrar o produto, incluindo a resposta a vulnerabilidades.", es: "Mantener bibliotecas, runtimes y plataformas al día sin romper el producto, incluida la respuesta a vulnerabilidades." }
    - id: deprecation
      name: { en: "Deprecation and Decommissioning", pt-BR: "Descontinuação e Desativação", es: "Desaprobación y Retiro" }
      desc: { en: "Retiring features and systems responsibly: migration paths, communication and data preservation.", pt-BR: "Aposentar recursos e sistemas com responsabilidade: caminhos de migração, comunicação e preservação de dados.", es: "Retirar funciones y sistemas con responsabilidad: rutas de migración, comunicación y preservación de datos." }

- id: scm-devops
  name: { en: "Configuration Management and DevOps", pt-BR: "Gestão de Configuração e DevOps", es: "Gestión de Configuración y DevOps" }
  desc: { en: "The path from a commit to a running system: version control, builds, pipelines, environments and releases.", pt-BR: "O caminho de um commit a um sistema em execução: controle de versão, builds, pipelines, ambientes e lançamentos.", es: "El camino de un commit a un sistema en ejecución: control de versiones, builds, pipelines, entornos y lanzamientos." }
  children:
    - id: version-control
