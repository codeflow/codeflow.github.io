      desc: { en: "Git workflows, trunk-based development, history hygiene and collaboration models for teams of any size.", pt-BR: "Fluxos com Git, desenvolvimento baseado em trunk, higiene do histórico e modelos de colaboração para times de qualquer tamanho.", es: "Flujos con Git, desarrollo basado en trunk, higiene del historial y modelos de colaboración para equipos de cualquier tamaño." }
    - id: build
      name: { en: "Build Systems and Artefacts", pt-BR: "Sistemas de Build e Artefatos", es: "Sistemas de Build y Artefactos" }
      desc: { en: "Reproducible builds, dependency resolution, artefact repositories and the supply chain of what gets deployed.", pt-BR: "Builds reprodutíveis, resolução de dependências, repositórios de artefatos e a cadeia de suprimentos do que é implantado.", es: "Builds reproducibles, resolución de dependencias, repositorios de artefactos y la cadena de suministro de lo que se despliega." }
    - id: ci-cd
      name: { en: "Continuous Integration and Delivery", pt-BR: "Integração e Entrega Contínuas", es: "Integración y Entrega Continuas" }
      desc: { en: "Pipelines that integrate, test and ship every change, with fast feedback and small batches as the goal.", pt-BR: "Pipelines que integram, testam e entregam cada mudança, com feedback rápido e lotes pequenos como objetivo.", es: "Pipelines que integran, prueban y entregan cada cambio, con retroalimentación rápida y lotes pequeños como objetivo." }
