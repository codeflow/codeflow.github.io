      desc: { en: "Batch and streaming pipelines, warehouses and lakes, data quality and lineage for analytics and machine learning.", pt-BR: "Pipelines em lote e em streaming, data warehouses e lakes, qualidade e linhagem de dados para análise e aprendizado de máquina.", es: "Pipelines por lotes y en streaming, almacenes y lagos de datos, calidad y linaje de datos para analítica y aprendizaje automático." }
