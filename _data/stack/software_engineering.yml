      desc: { en: "Packaging applications with their dependencies and running them at scale with schedulers such as Kubernetes.", pt-BR: "Empacotar aplicações com suas dependências e executá-las em escala com orquestradores como o Kubernetes.", es: "Empaquetar aplicaciones con sus dependencias y ejecutarlas a escala con orquestadores como Kubernetes." }
    - id: release
      name: { en: "Release Strategies", pt-BR: "Estratégias de Lançamento", es: "Estrategias de Lanzamiento" }
      desc: { en: "Blue-green, canary, feature flags and rollbacks: separating deployment from release to reduce risk.", pt-BR: "Blue-green, canário, feature flags e reversões: separar implantação de lançamento para reduzir risco.", es: "Blue-green, canario, feature flags y reversiones: separar el despliegue del lanzamiento para reducir el riesgo." }
    - id: environments
      name: { en: "Environments and Configuration", pt-BR: "Ambientes e Configuração", es: "Entornos y Configuración" }
