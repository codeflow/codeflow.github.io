      desc: { en: "Decomposing into independently deployable services and handling discovery, routing, retries and observability between them.", pt-BR: "Decompor em serviços implantáveis de forma independente e tratar descoberta, roteamento, novas tentativas e observabilidade entre eles.", es: "Descomponer en servicios desplegables de forma independiente y manejar descubrimiento, enrutamiento, reintentos y observabilidad entre ellos." }
