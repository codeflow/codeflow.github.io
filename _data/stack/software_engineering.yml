  children:
    - id: fundamentals-distributed
      name: { en: "Distributed Systems Fundamentals", pt-BR: "Fundamentos de Sistemas Distribuídos", es: "Fundamentos de Sistemas Distribuidos" }
      desc: { en: "Partial failure, clocks, consensus, replication and the CAP and PACELC trade-offs.", pt-BR: "Falha parcial, relógios, consenso, replicação e os trade-offs CAP e PACELC.", es: "Falla parcial, relojes, consenso, replicación y los compromisos CAP y PACELC." }
    - id: microservices
