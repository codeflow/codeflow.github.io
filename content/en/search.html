<!DOCTYPE html>
<html lang="en">
<head>
    <link rel="icon" type="image/png" href="../../resources/img/codeflow.png">

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Search results for Codeflow content">
    <meta name="keywords" content="search, results, programming, technology">
    <meta name="author" content="Rafael Santos">
    <meta name="robots" content="index, follow">
    <link rel="canonical" href="https://codeflow.com.br/content/en/search.html">
    
    <title>Search Results - Codeflow</title>
    <script src="../../resources/js/redirect-to-index.js"></script>
    <link rel="stylesheet" href="../../resources/css/themes/bluesky/theme.css">
    <link rel="stylesheet" href="../../resources/css/search.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.9.0/styles/github.min.css">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.9.0/highlight.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/highlightjs-line-numbers.js/2.8.0/highlightjs-line-numbers.min.js"></script>
    <script>
        
        // copyCode: fallback for standalone access (index.html already defines it globally)
        if (!window.copyCode) {
            window.copyCode = function(button) {
                var wrapper = button.closest('.code-block-wrapper');
                if (!wrapper) return;
                var codeEl = wrapper.querySelector('code');
                if (!codeEl) return;
                var text = codeEl.textContent;
                if (navigator.clipboard && navigator.clipboard.writeText) {
                    navigator.clipboard.writeText(text).then(function() {
                        var orig = button.textContent;
                        button.textContent = '✔ Copied!';
                        setTimeout(function() { button.textContent = orig; }, 2000);
                    });
                } else {
                    var ta = document.createElement('textarea');
                    ta.value = text; ta.style.position = 'fixed'; ta.style.opacity = '0';
                    document.body.appendChild(ta); ta.focus(); ta.select();
                    try { document.execCommand('copy'); } catch(e) {}
                    document.body.removeChild(ta);
                    var orig = button.textContent;
                    button.textContent = '✔ Copied!';
                    setTimeout(function() { button.textContent = orig; }, 2000);
                }
            };
        }
    </script>
</head>
<body>
    <div class="content-container">
        <h1>🔍 Search Results</h1>
        
        <div id="searchResultsContainer">
            <div class="search-loading">⏳ Loading results...</div>
        </div>
    </div>
    
    <script src="../../resources/js/search.js"></script>
    <script src="../../resources/js/search-page.js"></script>
</body>
</html>
