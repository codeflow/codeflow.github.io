    <title>Codeflow</title>
    <link rel="stylesheet" href="resources/css/themes/bluesky/theme.css">
    <link rel="stylesheet" href="resources/css/index.css">
    <link rel="stylesheet" href="resources/css/search.css">

        {
        "@context": "https://schema.org",
        "@type": "WebPage",
        "headline": "Codeflow",

        "datePublished": "2025-01-22",
        "author": {
            "@type": "Person",

            "name": "Codeflow",

            "@type": "ImageObject",
            "url": "https://codeflow.com.br/resources/img/codeflow.png"
            }

</head>
<body class="app-page">
    <div class="app-layout">
        <!-- Sidebar Menu -->
        <aside class="app-sidebar" id="sidebar">
            <div class="app-sidebar__header">
                <a href="index.html"><img src="resources/img/codeflow.png" alt="Codeflow" class="app-sidebar__logo"></a>
                <div class="app-sidebar__header-text">
                    <span>CODEFLOW</span>
                    <span class="version-badge" id="versionBadge" title="Loading version...">-</span>
                </div>
            </div>
            <div class="app-sidebar__content">
                <div class="app-search-box">
                    <input type="text" id="searchInput" placeholder="🔍 Search content..." class="app-search-input">
                    <button id="searchButton" class="app-search-button" title="Search">🔍</button>
                </div>
                <ul class="app-tree" id="treeView">
                    <!-- Menu will be built dynamically by menu.js -->
                </ul>
            </div>
            <div class="app-sidebar__resizer" id="resizer"></div>
        </aside>

        <!-- Content Area -->
        <main class="app-content">
            <div class="app-content__header">
                <div class="app-content__header-left">
                    <button class="app-mobile-menu-toggle" id="mobileMenuToggle" aria-label="Toggle menu">
                        <span></span>
                        <span></span>
                        <span></span>
                    </button>
                    <a href="index.html"><img src="resources/img/codeflow.png" alt="Codeflow" class="app-content__logo-mobile"></a>
                    <span id="contentHeader">Home</span>
                </div>
                <div class="language-selector">
                    <select id="languageSelector">
                        <option value="en" selected>🇺🇸 English</option>
                    </select>
                </div>
            </div>
            <div class="app-content__body" id="contentBody">
                <!-- Content will be loaded dynamically when a menu item is clicked -->
            </div>
        </main>
    </div>

    <!-- Mobile Overlay -->
    <div class="app-mobile-overlay" id="mobileOverlay"></div>

    <!-- External JavaScript files -->
    <script src="resources/js/hash.js"></script>
    <script src="resources/js/i18n.js"></script>
    <script src="resources/js/menu.js?v=2"></script>
    <script src="resources/js/sidebar.js"></script>
    <script src="resources/js/content.js"></script>
    <script src="resources/js/tree.js"></script>
    <script src="resources/js/search.js"></script>
    <script src="resources/js/giscus.js"></script>
    <script src="resources/js/main.js"></script>
    <script src="resources/js/welcome-data.js"></script>
    <script src="resources/js/index-page.js"></script>
    <script src="resources/js/version.js"></script>
    
    <!-- Service Worker Registration -->
    <script>
        if ('serviceWorker' in navigator) {
            window.addEventListener('load', () => {
                navigator.serviceWorker.register('/service-worker.js')
                    .then((registration) => {
                        console.log('Service Worker registrado com sucesso:', registration.scope);
                    })
                    .catch((error) => {
                        console.log('Falha ao registrar Service Worker:', error);
                    });
            });
        }
    </script>
</body>
</html>
