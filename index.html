<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Codeflow</title>
    <link rel="stylesheet" href="resources/css/themes/bluesky/theme.css">
    <script>
        // Redireciona imediatamente para a página inicial
        (function() {
            const lang = localStorage.getItem('codeflow-language') || (navigator.language.startsWith('en') ? 'en' : 'br');
            const homePath = `content/java.md/${lang}/1nqriq7eql.html`;
            window.location.href = homePath;
        })();
    </script>
</head>
<body class="app-page">
    <div class="app-layout">
        <!-- Menu Lateral -->
        <aside class="app-sidebar" id="sidebar">
            <div class="app-sidebar__header">
                <img src="resources/img/codeflow.png" alt="Codeflow" class="app-sidebar__logo">
                <span>CODEFLOW</span>
            </div>
            <div class="app-sidebar__content">
                <div class="app-search-box">
                    <input type="text" id="searchInput" placeholder="🔍 Buscar conteúdo..." class="app-search-input">
                    <button id="searchButton" class="app-search-button" title="Buscar">🔍</button>
                </div>
                <ul class="app-tree" id="treeView">
                    <!-- Menu será construído dinamicamente pelo menu.js -->
                </ul>
            </div>
            <div class="app-sidebar__resizer" id="resizer"></div>
        </aside>

        <!-- Área de Conteúdo -->
        <main class="app-content">
            <div class="app-content__header">
                <div class="app-content__header-left">
                    <button class="app-mobile-menu-toggle" id="mobileMenuToggle" aria-label="Toggle menu">
                        <span></span>
                        <span></span>
                        <span></span>
                    </button>
                    <img src="resources/img/codeflow.png" alt="Codeflow" class="app-content__logo-mobile">
                    <span id="contentHeader">Bem-vindo</span>
                </div>
                <div class="language-selector">
                    <select id="languageSelector">
                        <option value="br">🇧🇷 Português</option>
                        <option value="en">🇺🇸 English</option>
                    </select>
                </div>
            </div>
            <div class="app-content__body" id="contentBody">
                <!-- Conteúdo será carregado dinamicamente pelo JavaScript -->
            </div>
        </main>
    </div>

    <!-- Overlay para Mobile -->
    <div class="app-mobile-overlay" id="mobileOverlay"></div>

    <!-- JavaScript externo -->
    <script src="resources/js/hash.js"></script>
    <script src="resources/js/i18n.js"></script>
    <script src="resources/js/menu.js"></script>
    <script src="resources/js/sidebar.js"></script>
    <script src="resources/js/content.js"></script>
    <script src="resources/js/tree.js"></script>
    <script src="resources/js/main.js"></script>
    <script src="resources/js/search.js"></script>
</body>
</html>
