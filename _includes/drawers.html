  <div class="af-drawerDock">
    <div class="af-drawerTab" id="dtSumario" onclick="toggleDrawer('drSumario')">{{ t.ui.contents }}</div>
    <div class="af-drawerTab" id="dtAjuda" onclick="toggleDrawer('drAjuda')">{{ t.ui.help }}</div>
  </div>

  <div class="af-drawer" id="drSumario" data-tab="dtSumario">
    <div class="drHeader">
      {{ t.ui.article_contents }}
      <span class="drExpand" title="Expand/Restore" onclick="expandDrawer('drSumario')">
        <svg class="icoExpand" width="13" height="13" viewBox="0 0 14 14"><path d="M8.5 2H12v3.5M12 2L7.5 6.5" fill="none" stroke="#35597d" stroke-width="1.4"/><path d="M5.5 12H2V8.5M2 12l4.5-4.5" fill="none" stroke="#35597d" stroke-width="1.4"/></svg>
        <svg class="icoRestore" width="13" height="13" viewBox="0 0 14 14"><path d="M12 5.5H8.5V2M13 1L8.5 5.5" fill="none" stroke="#35597d" stroke-width="1.4"/><path d="M2 8.5h3.5V12M1 13l4.5-4.5" fill="none" stroke="#35597d" stroke-width="1.4"/></svg>
      </span>
      <span class="drClose" title="Close" onclick="toggleDrawer('drSumario')">✕</span>
    </div>
    <div class="drBody">
      <div class="cf-toc" id="tocSections"></div>
      <div class="af-spacer"></div>
      <div class="af-subHeader" style="margin-top:0;">{{ t.ui.figures }}</div>
      <div class="cf-toc" id="tocFigures"></div>
      <div class="af-spacer"></div>
      <p class="tip">{{ t.ui.toc_note }}</p>
    </div>
  </div>


  <div class="af-drawer" id="drAjuda" data-tab="dtAjuda">
    <div class="drHeader">
      <svg width="14" height="14" viewBox="0 0 16 16"><circle cx="8" cy="8" r="7" fill="#e8f0fa" stroke="#35618f"/><path d="M6 6.2c0-1.2.9-2 2-2s2 .7 2 1.8c0 1.6-2 1.6-2 3" fill="none" stroke="#35618f" stroke-width="1.5" stroke-linecap="round"/><circle cx="8" cy="11.6" r="1" fill="#35618f"/></svg>
      {{ t.ui.help }}
      <span class="drExpand" title="Expand/Restore" onclick="expandDrawer('drAjuda')">
        <svg class="icoExpand" width="13" height="13" viewBox="0 0 14 14"><path d="M8.5 2H12v3.5M12 2L7.5 6.5" fill="none" stroke="#35597d" stroke-width="1.4"/><path d="M5.5 12H2V8.5M2 12l4.5-4.5" fill="none" stroke="#35597d" stroke-width="1.4"/></svg>
        <svg class="icoRestore" width="13" height="13" viewBox="0 0 14 14"><path d="M12 5.5H8.5V2M13 1L8.5 5.5" fill="none" stroke="#35597d" stroke-width="1.4"/><path d="M2 8.5h3.5V12M1 13l4.5-4.5" fill="none" stroke="#35597d" stroke-width="1.4"/></svg>
      </span>
      <span class="drClose" title="Close" onclick="toggleDrawer('drAjuda')">✕</span>
    </div>
    <div class="drBody">
      <div class="af-subHeader" style="margin-top:0;">{{ t.ui.help_how_to_read }}</div>
      <p>{{ t.ui.help_p1 }}</p>
      <p>{{ t.ui.help_p2 }}</p>
      <p>{{ t.ui.help_p3 }}</p>
    </div>
  </div>
